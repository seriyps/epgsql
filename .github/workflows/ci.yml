name: CI

on:
  push:
    branches:
      - master
      - devel
  pull_request:
    branches:
      - devel
jobs:
  test:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        pg:
          - 12
        otp:
          - "24.0"
          - "23.3"
          - "22.3"
          - "21.3"
          - "20.3"
          - "19.3"
    env:
      - PATH=".:/usr/lib/postgresql/12/bin:$PATH"
    steps:
      - uses: actions/checkout@v2

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}

      - name: Setup postgresql server with postgis
        run: sudo apt install postgresql-${{matrix.pg}} postgresql-contrib-${{matrix.pg}} postgresql-${{matrix.pg}}-postgis-3 postgresql-${{matrix.pg}}-postgis-3-scripts

      - name: elvis
        run: make elvis

      - name: Common test, eunit, coverage
        run: make test

      - name: Build docs
        run: makde edoc

      - name: dialyzer
        run: make dialyzer
